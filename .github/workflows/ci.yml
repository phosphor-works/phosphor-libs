#
# Pull request and main CI. The jobs (Arch, Lint, Nix) are the shared C++ CI
# of the workspace repository (.github/workflows/cpp-ci.yml), which says what
# each one does. This file passes only what differs here.
#
# Fedora runs too: Arch ships the newest Qt, so on its own it passes code that
# calls an API added after the Qt the distro packages build with. The apps
# that build this tree from a pinned commit test it again inside their own
# builds, against the data they ship.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: phosphor-works/workspace/.github/workflows/cpp-ci.yml@v3
    with:
      pin-file: cmake/PhosphorDependencies.cmake
      # Run in the suite CI images of the packaging repository.
      ci-images: true
      fedora: true
      nix-timeout: 60
      nix-verify: |
        libs=$(find result/lib -maxdepth 1 -name 'libPhosphor*.so*' | wc -l)
        echo "Shared libraries: $libs"
        test "$libs" -gt 0 || { echo "::error::the package installed no libPhosphor*.so"; exit 1; }
        # The one program in bin/. It runs only when it finds its libraries.
        result/bin/phosphor-mcp-ipc --version
